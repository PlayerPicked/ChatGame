# ------------------------------------------------------------------
#  ChatGame configuration
#  All player-facing texts live in messages.yml.
# ------------------------------------------------------------------

# Names of the main command. The first one is the main name.
# Changes need a server restart.
aliases:
  - "chatgame"

# Seconds to wait after a round ends before the next one starts automatically.
time-between-games: 20

# Rounds only start automatically when at least this many players are online.
min-players: 1

# Console commands run for the winner. {player} = the winner's name.
# "[chance] command": entries with [100] always run, from the others exactly one
# is picked, weighted by its chance. An entry without [chance] has a chance of 1.
rewards:
  - "[20] give {player} gold_ingot 1"
  - "[15] give {player} diamond 1"

# ------------------------------------------------------------------
#  Games
#  enabled = picked by the automatic rotation (/chatgame start works either way)
#  time    = seconds before the round ends without a winner
# ------------------------------------------------------------------

# Copy a random sequence of characters (case sensitive).
random-characters:
  enabled: false
  time: 60
  length: 8

# Solve the left side; the right side is the answer. Format: "<problem> = <answer>"
math:
  enabled: false
  time: 60
  problems:
    - "5 x 5 = 25"
    - "7 + 3 = 10"
    - "8 - 4 = 4"
    - "6 x 3 = 18"
    - "12 / 4 = 3"
    - "9 + 6 = 15"
    - "15 - 7 = 8"
    - "10 x 2 = 20"
    - "14 / 7 = 2"
    - "18 - 9 = 9"
    - "4 x 6 = 24"
    - "25 / 5 = 5"
    - "11 + 4 = 15"
    - "13 - 6 = 7"
    - "3 x 8 = 24"
    - "9 x 2 = 18"
    - "20 / 4 = 5"
    - "17 - 5 = 12"
    - "3 x 7 = 21"
    - "16 / 2 = 8"
    - "19 - 8 = 11"
    - "12 x 2 = 24"
    - "30 / 5 = 6"
    - "10 + 10 = 20"
    - "6 x 4 = 24"
    - "14 - 4 = 10"
    - "5 x 8 = 40"
    - "9 / 3 = 3"
    - "18 + 7 = 25"
    - "13 + 2 = 15"
    - "7 x 3 = 21"
    - "11 / 1 = 11"
    - "21 / 7 = 3"
    - "20 + 4 = 24"
    - "8 x 4 = 32"
    - "15 / 3 = 5"
    - "6 + 9 = 15"
    - "10 / 2 = 5"
    - "13 x 2 = 26"
    - "17 + 3 = 20"
    - "8 / 2 = 4"
    - "7 x 6 = 42"
    - "5 + 5 = 10"
    - "3 x 9 = 27"

# Guess who is described. Format: "<description> = <answer>"
who-am-i:
  enabled: false
  time: 60
  words:
    - "I sneak at night, my bones creak, and I shoot arrows at you! = Skeleton"
    - "I sneak up quietly, then explode loudly, leaving a giant hole! = Creeper"
    - "Sunlight is my enemy, but at night I'll attack you! = Zombie"
    - "I strike in the darkness if you don't sleep enough! = Phantom"
    - "I steal blocks, won't attack unless you look into my eyes! = Enderman"
    - "I have three heads, I destroy hard, summon me and you better run! = Wither"
    - "I live in the forest, I watch you quietly, if you're kind to me, I'll follow you! = Wolf"

# Name the mob from its first letter. Format: "<letter> = <answer>"
word-stop:
  enabled: false
  time: 60
  mobs:
    - "Z = Zombie"
    - "E = Enderman"
    - "S = Skeleton"
    - "C = Creeper"
    - "W = Witch"
    - "P = Phantom"
    - "L = Llama"
    - "A = Axolotl"
    - "F = Fox"
    - "T = Turtle"
    - "S = Shulker"

# Unscramble the word.
word-guesser:
  enabled: false
  time: 60
  words:
    - "Apple"
    - "Desk"
    - "Computer"
    - "Studying"
    - "Island"
    - "Amazing"
    - "Bridge"
    - "Love"
    - "Cloud"

# Type the word that is shown backwards.
reverse:
  enabled: false
  time: 60
  words:
    - "Apple"
    - "Desk"
    - "Computer"
    - "Studying"
    - "Island"
    - "Amazing"
    - "Bridge"
    - "Love"
    - "Cloud"

# Half of the letters are hidden; type the full word.
fill-out:
  enabled: false
  time: 60
  words:
    - "Apple"
    - "Desk"
    - "Computer"
    - "Studying"
    - "Island"
    - "Amazing"
    - "Bridge"
    - "Love"
    - "Cloud"

# Players open a crafting table with /chatgame crafting and craft the item.
# Key = the item to craft, items-to-place = the ingredients handed out (vanilla material names).
crafting:
  enabled: false
  time: 120
  crafts:
    "IRON_SHOVEL":
      items-to-place:
        - "STICK"
        - "STICK"
        - "IRON_INGOT"

# Guess the number between the two bounds. Format: "<min>-<max>"
range:
  enabled: true
  time: 10
  range: "0-20"

# Guess the word letter by letter. Only single letters typed in chat count.
hangman:
  enabled: false
  time: 120
  # The round is lost after this many wrong letters.
  max-wrong-guesses: 6
  # true = every player may guess only one letter per round.
  only-once: false
  # Long words may not fit into the vanilla chat width.
  words:
    - "alma"

# ------------------------------------------------------------------
#  Win streaks
# ------------------------------------------------------------------
# A streak grows with every won round. Every player who was online when a round
# started and did not win it loses their streak.
streaks:
  enabled: true
  # Key = streak length. Texts are in messages.yml (streaks.reached / streaks.lost).
  # {player} and {streak} work in the commands.
  milestones:
    5:
      announce-reached: true
      announce-lost: true
      commands:
        - "give {player} diamond 5"

# ------------------------------------------------------------------
#  Feedback for the winner and at round start
# ------------------------------------------------------------------
toast:
  enabled: true
  # The icon of the toast; the text is toast.title in messages.yml.
  material: "BOOK"

# Vanilla sound keys, e.g. minecraft:entity.player.levelup
sounds:
  start:
    enabled: true
    sound: "minecraft:entity.zombie_villager.cure"
  win:
    enabled: true
    sound: "minecraft:entity.player.levelup"

# ------------------------------------------------------------------
#  Storage and network (changes need a server restart)
# ------------------------------------------------------------------
database:
  # h2 = local file (plugins/ChatGame/chatgame.mv.db), mysql = shared database
  type: "h2"
  mysql:
    host: "localhost"
    port: 3306
    database: "chatgame"
    username: "root"
    password: "change-me"
    pool-size: 10

# Run one chat game across several servers behind a proxy.
# Enable it on every server; exactly one of them must be the master.
redis:
  enabled: false
  host: "localhost"
  port: 6379
  # Leave empty if your Redis server has no password.
  password: ""
  database: 0
  ssl: false
  # Connection timeout in milliseconds.
  timeout: 2000
  # master = starts rounds and decides who wins; slave = shows the master's rounds.
  server-role: master
  # Unique name of this server. Leave empty to generate one on every start.
  # Never give two servers the same id, they would ignore each other.
  server-id: ""
  # Must be the same on every server of the network.
  channel-prefix: "chatgame"

# Do not change this; it is used to add new options to your file automatically.
version: "1"
